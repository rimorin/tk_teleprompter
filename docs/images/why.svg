<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="t d">
  <title id="t">Notes versus Teleprompter</title>
  <desc id="d">Left: a wall of notes with the question "Where was I?". Right: a script with your current line highlighted between reading-line markers, labelled "Following you".</desc>
  <style>
    .card { fill: #f6f5f1; stroke: #e2e0d9; }
    .screen { fill: #ffffff; stroke: #e2e0d9; }
    .bar { fill: #9ca0a8; opacity: .45; }
    .spoken { fill: #9ca0a8; opacity: .18; }
    .line { fill: #2f62d8; }
    .band { fill: #2f62d8; opacity: .1; }
    .mark { fill: #2f62d8; }
    .h { font: 600 17px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b1d21; }
    .p { font: 400 14px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5b606a; }
    .bad { fill: #b3261e; }
    .badpill { fill: #ffffff; stroke: #b3261e; }
    .badtext { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #b3261e; }
    .goodpill { fill: #2f62d8; opacity: .12; }
    .goodtext { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2f62d8; }
    .dot-good { fill: #2f62d8; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #16181d; stroke: #2a2d34; }
      .screen { fill: #0e0f12; stroke: #2a2d34; }
      .bar { fill: #9aa0ab; opacity: .4; }
      .spoken { fill: #9aa0ab; opacity: .14; }
      .line, .mark, .dot-good { fill: #7ea6ff; }
      .band { fill: #7ea6ff; opacity: .14; }
      .h { fill: #eceef2; }
      .p { fill: #9aa0ab; }
      .bad { fill: #ff7b7b; }
      .badpill { fill: #0e0f12; stroke: #ff7b7b; }
      .badtext { fill: #ff7b7b; }
      .goodpill { fill: #7ea6ff; opacity: .16; }
      .goodtext { fill: #7ea6ff; }
    }
  </style>
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="208">
      <stop offset="0" stop-color="#fff" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeout"><rect x="0" y="0" width="860" height="300" fill="url(#fade)" /></mask>
  </defs>

  <!-- Before: notes -->
  <rect class="card" x="1" y="1" width="418" height="298" rx="16" />
  <circle class="bad" cx="30" cy="34" r="6" />
  <text class="h" x="46" y="40">Notes on your phone</text>
  <rect class="screen" x="24" y="62" width="372" height="150" rx="12" />
  <g mask="url(#fadeout)">
    <rect class="bar" x="44" y="80" width="320" height="8" rx="4" />
    <rect class="bar" x="44" y="98" width="296" height="8" rx="4" />
    <rect class="bar" x="44" y="116" width="330" height="8" rx="4" />
    <rect class="bar" x="44" y="134" width="240" height="8" rx="4" />
    <rect class="bar" x="44" y="152" width="310" height="8" rx="4" />
    <rect class="bar" x="44" y="170" width="288" height="8" rx="4" />
    <rect class="bar" x="44" y="188" width="326" height="8" rx="4" />
  </g>
  <rect class="badpill" x="148" y="124" width="124" height="28" rx="14" />
  <text class="badtext" x="210" y="143" text-anchor="middle">Where was I?</text>
  <text class="p" x="24" y="246">You scroll by hand, and look for your place</text>
  <text class="p" x="24" y="268">again every time you look up.</text>

  <!-- After: teleprompter -->
  <rect class="card" x="441" y="1" width="418" height="298" rx="16" />
  <circle class="dot-good" cx="470" cy="34" r="6" />
  <text class="h" x="486" y="40">Teleprompter</text>
  <rect class="screen" x="464" y="62" width="372" height="150" rx="12" />
  <rect class="spoken" x="484" y="84" width="210" height="8" rx="4" />
  <rect class="spoken" x="484" y="102" width="170" height="8" rx="4" />
  <rect class="band" x="465" y="122" width="370" height="26" />
  <path class="mark" d="M465 128 l8 7 l-8 7 z" />
  <path class="mark" d="M835 128 l-8 7 l8 7 z" />
  <rect class="line" x="484" y="130" width="316" height="10" rx="5" />
  <rect class="bar" x="484" y="162" width="290" height="8" rx="4" />
  <rect class="bar" x="484" y="180" width="200" height="8" rx="4" />
  <rect class="goodpill" x="702" y="76" width="118" height="26" rx="13" />
  <text class="goodtext" x="761" y="94" text-anchor="middle">Following you</text>
  <text class="p" x="464" y="246">It listens and keeps your line at eye level.</text>
  <text class="p" x="464" y="268">Look up as long as you like. Your place waits.</text>
</svg>
