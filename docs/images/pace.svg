<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" role="img" aria-labelledby="t d">
  <title id="t">Fixed-speed scrolling versus following your voice</title>
  <desc id="d">A chart of place in the script over one minute. The speaker pauses for a laugh, then skips a sentence. A fixed-speed scroll keeps moving during the pause, so it runs ahead of the speaker, and after the skip it falls behind. Voice following stays on the speaker's line the whole time.</desc>
  <style>
    .card { fill: #f6f5f1; stroke: #e2e0d9; }
    .axis { stroke: #c9c6bd; stroke-width: 1; }
    .grid { stroke: #e2e0d9; stroke-width: 1; }
    .lbl { font: 400 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5b606a; }
    .h { font: 600 17px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b1d21; }
    .note { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #b3261e; }
    .you { fill: none; stroke: #2f62d8; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .scroll { fill: none; stroke: #8a8f99; stroke-width: 2.5; stroke-dasharray: 7 6; }
    .gap { fill: #b3261e; opacity: .12; }
    .key-you { fill: #2f62d8; } .key-scroll { fill: #8a8f99; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #16181d; stroke: #2a2d34; }
      .axis { stroke: #3a3e47; } .grid { stroke: #24272d; }
      .lbl { fill: #9aa0ab; } .h { fill: #eceef2; } .note { fill: #ff8a8a; }
      .you { stroke: #8ab4ff; } .key-you { fill: #8ab4ff; }
      .scroll { stroke: #7d838e; } .key-scroll { fill: #7d838e; }
      .gap { fill: #ff7b7b; opacity: .16; }
    }
  </style>
  <rect class="card" x="1" y="1" width="858" height="328" rx="16" />
  <text class="h" x="70" y="36">Where the script is, while you talk</text>
  <line class="grid" x1="70" y1="160.0" x2="820" y2="160.0" />
  <line class="axis" x1="70" y1="58" x2="70" y2="262" />
  <line class="axis" x1="70" y1="262" x2="820" y2="262" />
  <text class="lbl" x="56" y="160" text-anchor="middle" transform="rotate(-90 56 160)">Place in script</text>
  <text class="lbl" x="820" y="254" text-anchor="end">Time →</text>
  <polygon class="gap" points="320.0,202.0 420.0,178.0 632.5,127.0 632.5,151.0 420.0,202.0" />
  <polygon class="gap" points="632.5,127.0 820.0,82.0 820.0,58.0 632.5,103.0" />
  <path class="scroll" d="M70.0 262.0 L820.0 82.0" />
  <path class="you" d="M70.0 262.0 L320.0 202.0 L420.0 202.0 L632.5 151.0 L632.5 103.0 L820.0 58.0" />
  <text class="note" x="370.0" y="226.0" text-anchor="middle">You pause for a laugh.</text>
  <text class="note" x="370.0" y="244.0" text-anchor="middle">The scroll keeps going.</text>
  <text class="note" x="618.5" y="82.0" text-anchor="end">You skip a sentence.</text>
  <text class="note" x="618.5" y="100.0" text-anchor="end">The scroll falls behind.</text>
  <rect class="key-you" x="86" y="292" width="22" height="4" rx="2" />
  <text class="lbl" x="116" y="299">You, and this app (it stays on your line)</text>
  <rect class="key-scroll" x="410" y="292" width="8" height="4" rx="1" /><rect class="key-scroll" x="422" y="292" width="8" height="4" rx="1" />
  <text class="lbl" x="438" y="299">Fixed-speed scroll</text>
  <rect class="gap" x="578" y="288" width="14" height="12" rx="2" />
  <text class="lbl" x="600" y="299">How far off your place is</text>
</svg>
