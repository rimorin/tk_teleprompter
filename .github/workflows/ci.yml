name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g corepack@latest && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f apps/server/Dockerfile -t teleprompter-api .
      - run: docker build -f apps/web/Dockerfile -t teleprompter-web .
